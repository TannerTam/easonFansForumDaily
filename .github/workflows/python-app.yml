# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - 'question_bank.json'
      - 'site/**'
      - 'scripts/build_pages.py'
      - 'tests/test_search.mjs'
      - '.github/workflows/pages.yml'
      - '.gitignore'
      - 'README.md'

  schedule:
    - cron: '0 16 * * *'
    - cron: '0 6 * * *'
    # - cron: '*/1 * * * *'

permissions:
  contents: write

# 两个账号共享题库；同一分支的多个运行串行，避免覆盖彼此的记录。
concurrency:
  group: daily-mission-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
      with:
        ref: ${{ github.ref_name }}
        fetch-depth: 0

    - name: Set up Python 3.11
      uses: actions/setup-python@v3
      with:
        python-version: "3.11"

    - name: Install tesseract-ocr
      run: |
        sudo apt update
        sudo apt install -y tesseract-ocr

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install -r ./requirements.txt

    - name: Prepare chromedriver
      uses: nanasess/setup-chromedriver@v2

    - name: dailyMission
      env:
        USERNAME: ${{ secrets.USERNAME }}
        PASSWORD: ${{ secrets.PASSWORD }}
        MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
        MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        API_KEY: ${{ secrets.API_KEY }}
      run: |
        python dailyMission.py --headless

    - name: dailyMission for USER2
      env:
        USERNAME: ${{ secrets.USERNAME1 }}
        PASSWORD: ${{ secrets.PASSWORD1 }}
        MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
        MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        API_KEY: ${{ secrets.API_KEY }}
      run: |
        python dailyMission.py --headless

    - name: Back up question bank
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: question-bank-${{ github.run_id }}-${{ github.run_attempt }}
        path: question_bank.json
        if-no-files-found: warn

    - name: Commit question bank to current repository
      if: always()
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -- question_bank.json
        if git diff --cached --quiet -- question_bank.json; then
          echo "题库没有变化，无需提交。"
          exit 0
        fi
        git commit -m "chore: update question bank [skip ci]" -- question_bank.json
        for attempt in 1 2 3; do
          git fetch origin "$GITHUB_REF_NAME"
          git rebase FETCH_HEAD
          if git push origin "HEAD:$GITHUB_REF_NAME"; then
            exit 0
          fi
          sleep 2
        done
        echo "题库推送失败，可从本次运行的 artifact 下载备份。"
        exit 1
